name: Construir APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/android-nfc-pilot
    paths:
      - "www/**"
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  apk-debug:
    name: APK de prueba
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Conservar firma de prueba
        id: restore-signing
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: tamper-rewards-debug-keystore-v1

      - name: Preparar firma e informar SHA-1
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Tamper,C=MX" -keyalg RSA -keysize 2048 -validity 10000
          fi
          SHA1=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA1: //p')
          {
            echo "## Firma Android de prueba"
            echo ""
            echo "Paquete: \`com.tamper.rewards\`"
            echo ""
            echo "SHA-1: \`$SHA1\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar firma de prueba antes de validar Firebase
        if: steps.restore-signing.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: tamper-rewards-debug-keystore-v1

      - name: Instalar dependencias
        run: npm ci

      - name: Probar el lector NFC y la alternativa QR
        run: npm run test:nfc

      - name: Verificar proyecto Tamper Rewards
        run: npm run doctor

      - name: Sincronizar Capacitor con Android
        run: npm run sync -- android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          TAMPER_DEBUG_KEYSTORE="$HOME/.android/debug.keystore" ./gradlew :app:assembleDebug --no-daemon

      - name: Preparar archivo descargable
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Tamper-Rewards-v1.0.5-NFC-pilot-debug.apk

      - name: Verificar contenido nativo empaquetado
        shell: bash
        run: |
          unzip -p Tamper-Rewards-v1.0.5-NFC-pilot-debug.apk assets/capacitor.plugins.json > /tmp/tamper-capacitor-plugins.json
          unzip -p Tamper-Rewards-v1.0.5-NFC-pilot-debug.apk assets/public/native-bridge.js > /tmp/tamper-native-bridge.js
          grep -q 'FirebaseAuthenticationPlugin' /tmp/tamper-capacitor-plugins.json
          grep -q '1.0.4-google-oauth-diagnostics' /tmp/tamper-native-bridge.js
          grep -q 'cap.nativePromise(pluginName,methodName,options)' /tmp/tamper-native-bridge.js
          {
            echo ""
            echo "## Contenido nativo"
            echo ""
            echo "✅ El APK contiene Firebase Authentication."
            echo "✅ El APK contiene el puente nativo y diagnóstico OAuth Tamper Rewards 1.0.4."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verificar lector NFC empaquetado
        shell: bash
        run: |
          unzip -p Tamper-Rewards-v1.0.5-NFC-pilot-debug.apk assets/public/nfc-reader.js > /tmp/tamper-nfc-reader.js
          test -s /tmp/tamper-nfc-reader.js
          grep -q '1.0.5-nfc-pilot' /tmp/tamper-nfc-reader.js
          grep -q 'startScan' /tmp/tamper-nfc-reader.js
          echo 'Lector NFC incluido; pruebas de hardware pendientes.' >> "$GITHUB_STEP_SUMMARY"

      - name: Revisar configuración de Firebase
        shell: bash
        run: |
          if [ -f android/app/google-services.json ]; then
            KEY_SHA1="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA1: //p' | head -1)"
            export KEY_SHA1
            node <<'NODE'
          const fs=require('fs');
          const config=JSON.parse(fs.readFileSync('android/app/google-services.json','utf8'));
          const expectedPackage='com.tamper.rewards';
          const expectedSha=(process.env.KEY_SHA1||'').replaceAll(':','').toLowerCase();
          const clients=Array.isArray(config.client)?config.client:[];
          const androidClient=clients.find(client=>client?.client_info?.android_client_info?.package_name===expectedPackage);
          if(!androidClient)throw new Error(`google-services.json no contiene el paquete ${expectedPackage}`);
          const oauthClients=Array.isArray(androidClient.oauth_client)?androidClient.oauth_client:[];
          const matchingAndroid=oauthClients.find(client=>
            client?.client_type===1 &&
            client?.android_info?.package_name===expectedPackage &&
            String(client?.android_info?.certificate_hash||'').toLowerCase()===expectedSha
          );
          const webClient=oauthClients.find(client=>client?.client_type===3 && client?.client_id);
          if(!matchingAndroid)throw new Error(`Falta el cliente OAuth Android para ${expectedPackage} con SHA-1 ${process.env.KEY_SHA1}`);
          if(!webClient)throw new Error('Falta el cliente OAuth de tipo Aplicación web en google-services.json');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Firebase Android configurado.\n\n`+
            `- Paquete verificado: \`${expectedPackage}\`\n`+
            `- SHA-1 verificado: \`${process.env.KEY_SHA1}\`\n`+
            `- Cliente web: \`${webClient.client_id}\`\n`
          );
          NODE
          else
            echo "Falta android/app/google-services.json; no se publicará un APK sin Google Sign-In." >&2
            exit 1
          fi

      - name: Verificar firma y cliente OAuth del APK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER="$(command -v apksigner 2>/dev/null || true)"
          if [ -z "$APKSIGNER" ] && [ -n "$SDK_ROOT" ] && [ -d "$SDK_ROOT/build-tools" ]; then
            APKSIGNER="$(find "$SDK_ROOT/build-tools" \( -type f -o -type l \) -name apksigner -print 2>/dev/null | sort -V | tail -1 || true)"
          fi

          test -n "$APKSIGNER" || { echo "Falta apksigner" >&2; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs Tamper-Rewards-v1.0.5-NFC-pilot-debug.apk > /tmp/tamper-signature.txt
          cat /tmp/tamper-signature.txt
          APK_SHA1="$(sed -nE 's/^(Signer #[0-9]+ |V[0-9.]+ Signer: )certificate SHA-1 digest: //p' /tmp/tamper-signature.txt | head -1)"
          KEY_SHA1="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA1: //p' | head -1)"
          APK_SHA1_NORMALIZED=$(printf '%s' "$APK_SHA1" | tr -d ':' | tr '[:lower:]' '[:upper:]')
          KEY_SHA1_NORMALIZED=$(printf '%s' "$KEY_SHA1" | tr -d ':' | tr '[:lower:]' '[:upper:]')
          test -n "$APK_SHA1_NORMALIZED"
          test "$APK_SHA1_NORMALIZED" = "$KEY_SHA1_NORMALIZED" || { echo "La firma real no coincide con Firebase" >&2; exit 1; }
          OAUTH_RESOURCE="$(find android/app/build/generated/res -type f -name values.xml -exec grep -l 'name="default_web_client_id"' {} + | head -1)"
          test -n "$OAUTH_RESOURCE" || { echo "Faltan recursos Firebase generados" >&2; exit 1; }
          grep -q 'default_web_client_id' "$OAUTH_RESOURCE"
          grep -q 'google_app_id' "$OAUTH_RESOURCE"
          {
            echo "Firma criptográfica verificada por apksigner."
            echo "SHA-1 real del APK: $APK_SHA1"
            echo "La firma coincide con Firebase y existen los recursos OAuth."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Tamper-Rewards-APK-v1.0.5-NFC-pilot
          path: Tamper-Rewards-v1.0.5-NFC-pilot-debug.apk
          if-no-files-found: error
          retention-days: 14

