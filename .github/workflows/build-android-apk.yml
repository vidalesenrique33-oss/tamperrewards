name: Construir APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "www/**"
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - ".github/workflows/build-android-apk.yml"

env:
  TAMPER_EXPECTED_SHA1: "B2:B1:D0:5C:06:D4:27:19:B3:40:A0:16:BA:FA:09:E8:4E:F2:E8:AC"

permissions:
  contents: read

jobs:
  apk-debug:
    name: APK de prueba
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Conservar firma de prueba
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tamper-rewards-debug-keystore-v1

      - name: Preparar firma e informar SHA-1
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Tamper,C=MX" -keyalg RSA -keysize 2048 -validity 10000
          fi
          SHA1=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA1: //p' | head -1)
          if [ "$SHA1" != "$TAMPER_EXPECTED_SHA1" ]; then
            echo "La llave recuperada tiene SHA-1 $SHA1, pero Firebase espera $TAMPER_EXPECTED_SHA1." >&2
            echo "No se compilará otro APK firmado incorrectamente." >&2
            exit 1
          fi
          cp "$HOME/.android/debug.keystore" android/tamper-debug.keystore
          {
            echo "## Firma Android de prueba"
            echo ""
            echo "Paquete: \`com.tamper.rewards\`"
            echo ""
            echo "SHA-1 preparada para Gradle: \`$SHA1\`"
            echo ""
            echo "✅ Coincide con la huella registrada en Firebase."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar proyecto Tamper Rewards
        run: npm run doctor

      - name: Sincronizar Capacitor con Android
        run: npm run sync -- android

      - name: Revisar configuración de Firebase
        shell: bash
        run: |
          if [ -f android/app/google-services.json ]; then
            KEY_SHA1="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA1: //p' | head -1)"
            export KEY_SHA1
            node <<'NODE'
          const fs=require('fs');
          const config=JSON.parse(fs.readFileSync('android/app/google-services.json','utf8'));
          const expectedPackage='com.tamper.rewards';
          const expectedSha=(process.env.KEY_SHA1||'').replaceAll(':','').toLowerCase();
          const clients=Array.isArray(config.client)?config.client:[];
          const androidClient=clients.find(client=>client?.client_info?.android_client_info?.package_name===expectedPackage);
          if(!androidClient)throw new Error(`google-services.json no contiene el paquete ${expectedPackage}`);
          const oauthClients=Array.isArray(androidClient.oauth_client)?androidClient.oauth_client:[];
          const matchingAndroid=oauthClients.find(client=>
            client?.client_type===1 &&
            client?.android_info?.package_name===expectedPackage &&
            String(client?.android_info?.certificate_hash||'').toLowerCase()===expectedSha
          );
          const webClient=oauthClients.find(client=>client?.client_type===3 && client?.client_id);
          if(!matchingAndroid)throw new Error(`Falta el cliente OAuth Android para ${expectedPackage} con SHA-1 ${process.env.KEY_SHA1}`);
          if(!webClient)throw new Error('Falta el cliente OAuth de tipo Aplicación web en google-services.json');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Firebase Android configurado.\n\n`+
            `- Paquete verificado: \`${expectedPackage}\`\n`+
            `- SHA-1 verificado: \`${process.env.KEY_SHA1}\`\n`+
            `- Cliente web: \`${webClient.client_id}\`\n`
          );
          NODE
          else
            echo "Falta android/app/google-services.json; no se publicará un APK sin Google Sign-In." >&2
            exit 1
          fi

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Preparar archivo descargable
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Tamper-Rewards-v1.0.6-debug.apk

      - name: Verificar contenido nativo empaquetado
        shell: bash
        run: |
          unzip -p Tamper-Rewards-v1.0.6-debug.apk assets/capacitor.plugins.json > /tmp/tamper-capacitor-plugins.json
          unzip -p Tamper-Rewards-v1.0.6-debug.apk assets/public/native-bridge.js > /tmp/tamper-native-bridge.js
          grep -q 'FirebaseAuthenticationPlugin' /tmp/tamper-capacitor-plugins.json
          grep -q '1.0.6-fixed-apk-signature' /tmp/tamper-native-bridge.js
          grep -q "callNative('TamperGoogleAuth','signIn'" /tmp/tamper-native-bridge.js
          grep -q 'registerPlugin(TamperGoogleAuthPlugin.class)' android/app/src/main/java/com/tamper/rewards/MainActivity.java
          {
            echo ""
            echo "## Contenido nativo"
            echo ""
            echo "✅ El APK contiene Firebase Authentication."
            echo "✅ El APK contiene el acceso directo por ID token de Tamper Rewards 1.0.6."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verificar firma y cliente OAuth del APK
        shell: bash
        run: |
          APK_SHA1="$(node scripts/apk-signature.mjs Tamper-Rewards-v1.0.6-debug.apk --sha1)"
          KEY_SHA1="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA1: //p' | head -1)"
          export APK_SHA1 KEY_SHA1

          node <<'NODE'
          const fs=require('fs');
          const normalize=value=>String(value||'').replaceAll(':','').toUpperCase();
          const expectedPackage='com.tamper.rewards';
          const expectedSha=normalize(process.env.TAMPER_EXPECTED_SHA1);
          const apkSha=normalize(process.env.APK_SHA1);
          const keySha=normalize(process.env.KEY_SHA1);
          if(!apkSha)throw new Error('No se pudo leer la firma real del APK');
          if(apkSha!==keySha)throw new Error(`El APK quedó firmado con ${process.env.APK_SHA1}, no con la llave ${process.env.KEY_SHA1}`);
          if(apkSha!==expectedSha)throw new Error(`La firma real ${process.env.APK_SHA1} no coincide con Firebase ${process.env.TAMPER_EXPECTED_SHA1}`);

          const config=JSON.parse(fs.readFileSync('android/app/google-services.json','utf8'));
          const clients=Array.isArray(config.client)?config.client:[];
          const androidClient=clients.find(client=>client?.client_info?.android_client_info?.package_name===expectedPackage);
          const oauthClients=Array.isArray(androidClient?.oauth_client)?androidClient.oauth_client:[];
          const matchingAndroid=oauthClients.find(client=>client?.client_type===1&&
            client?.android_info?.package_name===expectedPackage&&
            normalize(client?.android_info?.certificate_hash)===apkSha);
          const webClient=oauthClients.find(client=>client?.client_type===3&&client?.client_id);
          if(!matchingAndroid)throw new Error(`Firebase no contiene el APK ${expectedPackage} / ${process.env.APK_SHA1}`);
          if(!webClient)throw new Error('Firebase no contiene el cliente OAuth web necesario para solicitar el ID token');
          NODE

          OAUTH_RESOURCE="$(find android/app/build/generated/res -type f -name values.xml -path '*google-services*' -print -quit 2>/dev/null || true)"
          if [ -z "$OAUTH_RESOURCE" ] || ! grep -q 'default_web_client_id' "$OAUTH_RESOURCE"; then
            echo "Android no generó default_web_client_id desde google-services.json." >&2
            exit 1
          fi

          {
            echo ""
            echo "## Verificación del APK"
            echo ""
            echo "SHA-1 real del APK: \`$APK_SHA1\`"
            echo ""
            echo "✅ La firma real del APK coincide con la llave y con Firebase."
            echo "✅ Firebase contiene el cliente Android para este paquete y esta firma."
            echo "✅ Android generó \`default_web_client_id\` desde Firebase."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Tamper-Rewards-APK-v1.0.6
          path: Tamper-Rewards-v1.0.6-debug.apk
          if-no-files-found: error
          retention-days: 14
